name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm run release
      - run: npm run release:publish -- --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-candidate
          path: output/releases/
